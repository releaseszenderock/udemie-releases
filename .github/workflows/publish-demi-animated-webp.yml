name: Publish Demi Animated WebP
on:
  push:
    branches: [assets/demi-v2]
    paths:
      - "scripts/mascot/demi-v2-animations.py"
      - ".github/workflows/publish-demi-animated-webp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-animations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install animation dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate animated WebP from versioned v2 mascot PNGs
        run: python scripts/mascot/demi-v2-animations.py
      - name: Package download ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('design/mascot/demi/v2/animations')
          clips=sorted(root.glob('demi-*-animated.webp'))
          assert len(clips)==3, len(clips)
          target=Path('design/mascot/demi/v2/demi-animated-webp-v1.zip')
          with ZipFile(target, 'w', ZIP_DEFLATED) as zipfile:
              for p in clips:
                  zipfile.write(p,p.name)
          print(f'{target}: {target.stat().st_size} bytes / {len(clips)} animations')
          PY
      - name: Publish downloadable animation files
        run: |
          git add design/mascot/demi/v2/animations/*.webp design/mascot/demi/v2/demi-animated-webp-v1.zip
          if git diff --cached --quiet; then
            echo "Animations are already up to date"
          else
            git -c user.name='udemie-assets-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(mascot): publish animated WebP loops for Demi'
            git push origin HEAD:assets/demi-v2
          fi
