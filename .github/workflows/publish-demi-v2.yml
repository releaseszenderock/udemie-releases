name: Publish Demi v2 mascot assets
on:
  push:
    branches: [assets/demi-v2]
    paths:
      - "scripts/mascot/demi-v2-reproduce.py"
      - ".github/workflows/publish-demi-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vector and PNG export dependencies
        run: python -m pip install --disable-pip-version-check svgwrite cairosvg pillow
      - name: Generate exact package from versioned source
        run: python scripts/mascot/demi-v2-reproduce.py
      - name: Verify ZIP and transparency
        run: |
          unzip -t udemie-demi-asset-pack-v2.zip | tail -n 2
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          imgs=list(Path('demi_v2_assets/png/256').glob('*.png'))
          assert len(imgs)==10, len(imgs)
          assert all(Image.open(p).mode == 'RGBA' for p in imgs)
          print('10 transparent PNGs validated')
          PY
      - name: Commit downloadable ZIP to asset branch
        run: |
          mkdir -p design/mascot/demi/v2
          cp udemie-demi-asset-pack-v2.zip design/mascot/demi/v2/udemie-demi-asset-pack-v2.zip
          git add design/mascot/demi/v2/udemie-demi-asset-pack-v2.zip
          if git diff --cached --quiet; then
            echo "Archive already up to date"
          else
            git -c user.name='udemie-assets-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(mascot): publish Demi v2 PNG and SVG ZIP'
            git push origin HEAD:assets/demi-v2
          fi
